experiment_name: multiclass_resnet50_local_rtx4060
seed: 20260918

data:
  backend: cifar10_multiclass
  dataset_root: data
  download: true
  n_clients: 20
  samples_per_client: 250    # 20x250 = 5,000 training samples - enough for ResNet-50 to learn
  heterogeneity_alpha: 0.5
  audit_samples: 200
  test_samples: 2000

model:
  name: groupnorm_resnet50
  num_classes: 10
  base_width: 16   # slim ResNet-50: ~1.5M params; fastest on RTX 4060

execution:
  require_cuda: true

federated:
  rounds: 40        # ~2.6s/round on RTX 4060 = ~104s/epsilon
  local_epochs: 2
  local_batch_size: 32
  learning_rate: 0.05
  client_sample_rate: 0.5
  # The multiclass backend hands each client its examples grouped by class.
  # Without reshuffling, mini-batches hold ~2 of 10 classes and deep models
  # never leave chance accuracy. Keep this on.
  shuffle_local_batches: true
  # Local momentum is available but measured worse here (20.1% -> 15.8% at
  # eps=inf): the optimizer state is rebuilt every round, so 2 local epochs is
  # too short to amortise it. Leave at 0 unless local_epochs is raised.
  local_momentum: 0.0

privacy:
  enabled: true
  population_size: 20
  delta: 1.0e-5
  clip_norm: 1.0
  noise_multiplier: 1.0   # auto-calibrated per epsilon target
  sampling: poisson
  release_count: 1

evaluation:
  # epsilon=inf = no DP control (should reach ~35%+ with enough data)
  # epsilon=32  = tight DP
  # epsilon=8   = very tight DP
  epsilons: [32.0, 8.0, "inf"]
  seeds: [20260918]
  validity_threshold_invalid: 0.25
  validity_threshold_warning: 0.40

deletion:
  kind: client
  client_id: 2

unlearning:
  method: finetune_retained
  rounds: 2

output:
  root: results/utility_sweep_resnet50

notes: >
  40-round local sweep for RTX 4060 Laptop GPU with adequate data per client (250 samples).
  ResNet-50 (base_width=16) has 1,484,186 parameters against SmallGroupNormCNN's 60,554.
  Under client-level DP the injected noise has norm sigma*C*sqrt(d) while the signal is at
  most q*N clipped updates of norm C, so the per-round SNR q*N/(sigma*sqrt(d)) falls by
  sqrt(1484186/60554) = 4.95x purely from the parameter count. At N=20, q=0.5 this config
  sits far below the validated frontier point (N=100, q=0.5, T=60, eps=32, SNR 0.205).
  Treat the finite-epsilon rows here as a dimension-scaling demonstration, not a utility
  target; use the eps=inf row as the architecture's non-private ceiling.
